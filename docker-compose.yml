# Local services for development.
#
#   docker compose up -d
#
# - postgres: the app database (DATABASE_URL)
# - redis: rate limiting during development (LOCAL_REDIS_URL). Production uses Upstash instead,
#   see `src/server/services/rateLimiter.ts`.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chirp
      POSTGRES_PASSWORD: chirp
      POSTGRES_DB: chirp
    ports:
      - "55432:5432"
    volumes:
      - chirp-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chirp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chirp-postgres:
