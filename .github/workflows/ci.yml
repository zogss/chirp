name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # CI only type-checks, lints and checks formatting, no service is reached
  SKIP_ENV_VALIDATION: "true"
  DATABASE_URL: "postgresql://chirp:chirp@localhost:5432/chirp"

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn check-types

      - name: Lint
        run: yarn lint

      - name: Format
        run: yarn prettier --check "**/*.{js,jsx,ts,tsx,json,css,md}"
